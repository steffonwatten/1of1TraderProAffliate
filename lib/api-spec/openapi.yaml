openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: 1OF1 Trader Pro Affiliate Back Office API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public endpoints
  - name: auth
    description: Authentication
  - name: affiliate
    description: Affiliate dashboard
  - name: admin
    description: Admin operations
  - name: webhooks
    description: Webhook handlers
  - name: tracking
    description: Click and session tracking
  - name: client-auth
    description: Trading-client signup and authentication
  - name: client
    description: Trading-client portal (wallet, KYC, funding, trading accounts)
  - name: broker-admin
    description: Broker back-office (KYC review, funding approvals, settings)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Public
  /affiliate/apply:
    post:
      operationId: submitAffiliateApplication
      tags: [public]
      summary: Submit affiliate application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffiliateApplicationRequest"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /r/{referralCode}:
    get:
      operationId: handleReferralRedirect
      tags: [public]
      summary: Handle referral redirect
      parameters:
        - name: referralCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to landing page

  # Tracking
  /track/click:
    post:
      operationId: trackClick
      tags: [tracking]
      summary: Track referral click
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackClickRequest"
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackClickResponse"

  /track/lead:
    post:
      operationId: trackLead
      tags: [tracking]
      summary: Track lead signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackLeadRequest"
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Webhooks
  /webhooks/whop:
    post:
      operationId: handleWhopWebhook
      tags: [webhooks]
      summary: Handle Whop webhook event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Admin - Applications
  /admin/applications:
    get:
      operationId: getAdminApplications
      tags: [admin]
      summary: Get all applications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, denied]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Applications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationsListResponse"

  /admin/applications/{id}:
    get:
      operationId: getAdminApplication
      tags: [admin]
      summary: Get application detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateApplication"

  /admin/applications/{id}/approve:
    post:
      operationId: approveApplication
      tags: [admin]
      summary: Approve application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationActionRequest"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/applications/{id}/deny:
    post:
      operationId: denyApplication
      tags: [admin]
      summary: Deny application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationActionRequest"
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Admin - Affiliates
  /admin/affiliates:
    get:
      operationId: getAdminAffiliates
      tags: [admin]
      summary: Get all affiliates
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, terminated]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Affiliates list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliatesListResponse"

  /admin/affiliates/{id}:
    get:
      operationId: getAdminAffiliate
      tags: [admin]
      summary: Get affiliate detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Affiliate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateDetail"

  /admin/affiliates/{id}/commission:
    patch:
      operationId: updateAffiliateCommission
      tags: [admin]
      summary: Update affiliate commission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommissionRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/affiliates/{id}/status:
    patch:
      operationId: updateAffiliateStatus
      tags: [admin]
      summary: Update affiliate status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAffiliateStatusRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/affiliates/{id}/commission-rules:
    get:
      operationId: getAffiliateCommissionRules
      tags: [admin]
      summary: Get affiliate commission rules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Commission rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionRule"
    post:
      operationId: createCommissionRule
      tags: [admin]
      summary: Create commission rule for affiliate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommissionRuleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRule"

  /admin/commission-rules/{ruleId}:
    patch:
      operationId: updateCommissionRule
      tags: [admin]
      summary: Update commission rule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommissionRuleRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRule"
    delete:
      operationId: deleteCommissionRule
      tags: [admin]
      summary: Delete commission rule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Admin - Overview
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get admin dashboard overview stats
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get admin analytics data
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"

  # Admin - Payouts
  /admin/payouts:
    get:
      operationId: getAdminPayouts
      tags: [admin]
      summary: Get all payouts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Payouts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayoutsListResponse"
    post:
      operationId: createPayout
      tags: [admin]
      summary: Create a payout batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayoutRequest"
      responses:
        "201":
          description: Payout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"

  /admin/payouts/{id}/mark-paid:
    post:
      operationId: markPayoutPaid
      tags: [admin]
      summary: Mark payout as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payoutReference:
                  type: string
      responses:
        "200":
          description: Marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/payouts/export:
    get:
      operationId: exportPayouts
      tags: [admin]
      summary: Export payouts as CSV
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: affiliateId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string

  # Admin - Commissions
  /admin/commissions:
    get:
      operationId: getAdminCommissions
      tags: [admin]
      summary: Get all commissions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, paid, voided]
        - name: affiliateId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Commissions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionsListResponse"

  /admin/commissions/{id}:
    patch:
      operationId: adjustCommission
      tags: [admin]
      summary: Manually adjust a commission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCommissionRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Admin - Sales/Memberships
  /admin/memberships:
    get:
      operationId: getAdminMemberships
      tags: [admin]
      summary: Get all memberships synced from Whop
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: affiliateId
          in: query
          schema:
            type: integer
        - name: country
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Memberships list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipsListResponse"

  # Admin - Audit Logs
  /admin/audit-logs:
    get:
      operationId: getAuditLogs
      tags: [admin]
      summary: Get audit logs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsListResponse"

  # Admin - Email Logs
  /admin/email-logs:
    get:
      operationId: getEmailLogs
      tags: [admin]
      summary: Get email send logs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Email logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLogsListResponse"

  # Admin - Whop Sync
  /admin/sync/whop/memberships:
    post:
      operationId: syncWhopMemberships
      tags: [admin]
      summary: Manually trigger Whop membership sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /admin/sync/whop/payments:
    post:
      operationId: syncWhopPayments
      tags: [admin]
      summary: Manually trigger Whop payments sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  # Admin - Users management
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, affiliate]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Affiliate Dashboard
  /affiliate/dashboard:
    get:
      operationId: getAffiliateDashboard
      tags: [affiliate]
      summary: Get affiliate dashboard stats
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateDashboard"

  /affiliate/customers:
    get:
      operationId: getAffiliateCustomers
      tags: [affiliate]
      summary: Get affiliate's referred customers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateCustomersListResponse"

  /affiliate/commissions:
    get:
      operationId: getAffiliateCommissions
      tags: [affiliate]
      summary: Get affiliate's commissions
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Commissions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateCommissionsListResponse"

  /affiliate/payouts:
    get:
      operationId: getAffiliatePayouts
      tags: [affiliate]
      summary: Get affiliate's payouts
      responses:
        "200":
          description: Payouts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutsListResponse"

  /affiliate/analytics:
    get:
      operationId: getAffiliateAnalytics
      tags: [affiliate]
      summary: Get affiliate analytics
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateAnalytics"

  /affiliate/links:
    get:
      operationId: getAffiliateLinks
      tags: [affiliate]
      summary: Get affiliate's referral links and UTM links
      responses:
        "200":
          description: Links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateLinks"
    post:
      operationId: createCampaignLink
      tags: [affiliate]
      summary: Create campaign UTM link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignLinkRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignLink"

  /affiliate/profile:
    get:
      operationId: getAffiliateProfile
      tags: [affiliate]
      summary: Get affiliate profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateProfile"
    patch:
      operationId: updateAffiliateProfile
      tags: [affiliate]
      summary: Update affiliate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAffiliateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Trading-client auth
  /client/auth/register:
    post:
      operationId: clientRegister
      tags: [client-auth]
      summary: Register a trading client and email a verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRegisterRequest"
      responses:
        "201":
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCodeSentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /client/auth/resend-code:
    post:
      operationId: clientResendCode
      tags: [client-auth]
      summary: Resend the email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientResendCodeRequest"
      responses:
        "200":
          description: Verification code re-sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCodeSentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Resend throttled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /client/auth/verify-email:
    post:
      operationId: clientVerifyEmail
      tags: [client-auth]
      summary: Verify the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientVerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientVerifyEmailResponse"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /client/auth/set-password:
    post:
      operationId: clientSetPassword
      tags: [client-auth]
      summary: Set the password after email verification and log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSetPasswordRequest"
      responses:
        "200":
          description: Password set, session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAuthResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /client/auth/login:
    post:
      operationId: clientLogin
      tags: [client-auth]
      summary: Trading-client login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLoginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /client/auth/logout:
    post:
      operationId: clientLogout
      tags: [client-auth]
      summary: Trading-client logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientLogoutResponse"

  /client/me:
    get:
      operationId: getClientMe
      tags: [client-auth]
      summary: Get the authenticated trading client
      responses:
        "200":
          description: Current client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Trading-client KYC
  /client/kyc:
    get:
      operationId: getClientKyc
      tags: [client]
      summary: Get the client's KYC status and uploaded documents
      responses:
        "200":
          description: KYC state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKycStatusResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /client/kyc/documents:
    post:
      operationId: uploadClientKycDocument
      tags: [client]
      summary: Upload a KYC document (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                docType:
                  type: string
                  enum: [id_front, id_back, proof_of_address]
                file:
                  type: string
                  format: binary
              required:
                - docType
                - file
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKycUploadResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Broker admin — clients & KYC
  /admin/broker/clients:
    get:
      operationId: listBrokerClients
      tags: [broker-admin]
      summary: List trading clients
      parameters:
        - name: kycStatus
          in: query
          required: false
          schema:
            type: string
            enum: [none, pending, approved, rejected]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerClientListResponse"

  /admin/broker/clients/{id}:
    get:
      operationId: getBrokerClientDetail
      tags: [broker-admin]
      summary: Get one trading client with KYC docs, wallet and accounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerClientDetailResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/broker/clients/{id}/kyc-decision:
    post:
      operationId: decideBrokerClientKyc
      tags: [broker-admin]
      summary: Approve or reject a client's KYC
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerKycDecisionRequest"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerKycDecisionResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/broker/kyc/documents/{id}/file:
    get:
      operationId: getBrokerKycDocumentFile
      tags: [broker-admin]
      summary: Stream a KYC document file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
