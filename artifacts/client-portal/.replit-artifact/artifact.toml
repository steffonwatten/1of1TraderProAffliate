kind = "web"
previewPath = "/portal"
title = "1OF1 Markets — Client Portal"
version = "1.0.0"
id = "artifacts/client-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/portal" ]
localPort = 20464

[services.development]
run = "pnpm --filter @workspace/client-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/client-portal", "run", "build" ]
publicDir = "artifacts/client-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20464"
BASE_PATH = "/portal"
