packages:
  "framer-motion": "For page transitions and polished interactive animations"
  "recharts": "For beautiful analytics and financial charts"
  "date-fns": "For formatting dates in tables and charts"
  "lucide-react": "For crisp, consistent iconography across the dashboard"
  "react-hook-form": "For robust form state management in the complex application form"
  "@hookform/resolvers": "For integrating Zod validation with the application form"

images:
  - path: "artifacts/affiliate-dashboard/public/images/hero-bg.png"
    description: "Dark, moody, abstract financial background with subtle geometric grid lines and a soft glowing electric-blue light leak on deep navy, symbolizing premium trading. NOTE: the file currently in the repo is the previous gold artwork, hue-rotated to blue by the .hero-grid CSS filter. Replacing it with genuinely blue artwork means deleting that filter line in index.css."
    aspect_ratio: "16:9"

notes:
  - Global fetch interceptor added in src/lib/auth.tsx to inject the Bearer token for all requests.
  - Relying on @workspace/api-client-react for TanStack Query hooks.
  - Using existing shadcn/ui components from src/components/ui.
